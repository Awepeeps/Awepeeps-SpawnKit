# Example only: the consuming server chooses its own content and date window.
spawn-zone:
  enabled: true
  core-depth: 3
  clear-height: 3
  margin: 1
  beds: 1
  chests: 1
  manage-spawn-radius: true

spawn-kit:
  enabled: true
  starts-on: "2026-01-01"
  expires-on: "2026-12-31"
  timezone: "UTC"
  spawn-marker:
    enabled: true
    name: "World Spawn"
  house:
    enabled: true
    furnishings:
      anvil: true
      furnace: true
      lodestone: true
      crafting-table: true
      exterior-banners: true
      exterior-torches: true
      banners:
        left: WHITE
        right: RED
      extras:
        - BARREL
        - ENDER_CHEST
    chest:
      enabled: true
      items:
        - material: TORCH
          amount: 32
        - material: BREAD
          amount: 16
