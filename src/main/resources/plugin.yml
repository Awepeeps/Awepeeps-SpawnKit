name: AwepeepsSpawnKit
version: '${version}'
main: com.awepeeps.spawnkit.AwepeepsSpawnKit
api-version: '1.21'
description: Protects a spawn core and builds a configurable, expiring spawn house and starter kit.
authors: [Awepeeps]
softdepend: [BlueMap]
commands:
  spawnkit:
    description: Build or migrate the protected spawn layout for the current world.
    usage: /spawnkit build confirm [force] [items] [supplies]
    permission: awepeepsspawnkit.admin
permissions:
  awepeepsspawnkit.admin:
    description: Allows building or migrating the spawn layout.
    default: op
